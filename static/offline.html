<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>FarmPaddy - Offline</title>
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				display: flex; align-items: center; justify-content: center;
				min-height: 100vh; background: #f0f7f4; color: #1b4332;
				padding: 1rem; text-align: center;
			}
			.container { max-width: 400px; }
			h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #2d6a4f; }
			p { margin-bottom: 1rem; color: #555; }
			button {
				background: #2d6a4f; color: white; border: none;
				padding: 0.75rem 1.5rem; border-radius: 0.5rem;
				font-size: 1rem; cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>You're Offline</h1>
			<p>FarmPaddy needs an internet connection for this page. Your saved data is still available.</p>
			<button onclick="window.location.reload()">Try Again</button>
		</div>
	</body>
</html>
