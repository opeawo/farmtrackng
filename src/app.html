<!doctype html>
<html lang="en-NG" data-theme="farmtrack">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#2d6a4f" />
		<meta name="application-name" content="FarmPaddy" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="FarmPaddy" />
		<meta name="format-detection" content="telephone=no" />

		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />

		<!-- JSON-LD Organization schema -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"name": "FarmPaddy",
				"url": "https://farmtrack.ng",
				"logo": "https://farmtrack.ng/icons/icon-512.png",
				"description": "FarmPaddy is a digital assistant for Nigerian farmers, livestock keepers, and animal health workers — animal health AI, market prices, and equipment financing.",
				"parentOrganization": { "@type": "Organization", "name": "Fast Forward Livestock Venture Studio" },
				"areaServed": { "@type": "Country", "name": "Nigeria" },
				"contactPoint": {
					"@type": "ContactPoint",
					"contactType": "customer support",
					"email": "hello@livestockfunds.com"
				}
			}
		</script>

		<!-- JSON-LD WebSite schema (helps Google understand sitelinks) -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "FarmPaddy",
				"url": "https://farmtrack.ng",
				"inLanguage": "en-NG"
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
